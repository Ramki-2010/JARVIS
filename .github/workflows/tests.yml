# Unit tests on every pull request and on every push to main (ADVISORY until RK asks for it to be a required check).
# Read-only: no secrets, no write permission, no pull_request_target. Actions are pinned to full commit hashes
# (a tag can be moved; a hash cannot). The only third-party package the suite needs is tzdata, pinned to the
# version used on RK's machine; the control plane itself has no dependencies.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the one test dependency (pinned)
        run: python -m pip install tzdata==2026.6
      - name: Run the unit tests
        run: python -m unittest discover -t . -s tests
