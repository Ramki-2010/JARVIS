# JARVIS Phase 1 policy, version 1.
#
# Sources: ADR-0003 D12 (initial capability matrix) and D2, ADR-0008 D1 (initial
# user-secret locations), Master Context section 13 and section 33.
#
# Changing any row or entry here is a policy change (G-03) and, for the secret
# locations, a credential decision (G-07). It is made only by RK, by pull request.
# A content change must raise policy_version (ADR-0003 D6).
#
# Capability keys:
#   name                   capability name
#   base_level             L0..L5 (Master Context section 12)
#   requires_isolation     true: DEFER (ISOLATION_REQUIRED) until isolation exists
#   allowed_classes        target classes allowed. Omitted means ANY class except the
#                          always-deny classes and UNCLASSIFIED (ADR-0003 D12)
#   phase_enabled          false: DEFER (PHASE_NOT_ENABLED)
#   mechanism_implemented  false: DEFER (MECHANISM_NOT_IMPLEMENTED)
#   forbidden_l5           true: DENY (FORBIDDEN_L5)
#   non_goal               true: DENY (NON_GOAL_V01), Master Context section 33

schema_version = 1
policy_version = 1

# --- Phase 1 ALLOW set: exactly four capabilities -------------------------------

[[capability]]
name = "CREATE_TASK"
base_level = "L2"
requires_isolation = false
allowed_classes = ["CONTROL_PLANE_RECORD"]
phase_enabled = true
mechanism_implemented = true
forbidden_l5 = false
non_goal = false

