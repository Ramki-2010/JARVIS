# --- Initial user-secret locations (ADR-0008 D1) ---------------------------------
# Paths are relative to <USER_HOME>, which comes from governance-zone configuration
# and never from an environment variable (ADR-0006 section 3.3). A target equal to
# or inside an entry is classified USER_SECRET_LOCATION and is always DENY.

[secret_locations]
user_home_relative = [
    # SSH and signing keys
    '.ssh',
    '.gnupg',
    # Git and generic credentials
    '.git-credentials',
    '.netrc',
    '_netrc',
    # Developer and cloud tool credentials
    '.aws',
    '.azure',
    '.config\gcloud',
    '.kube',
    '.docker',
    '.npmrc',
    '.pypirc',
    '.config\gh',
    'AppData\Roaming\GitHub CLI',
    # AI tool credentials and configuration
    '.claude',
    '.claude.json',
    '.codex',
    'AppData\Roaming\Claude',
    # Windows credential and key stores
    'AppData\Roaming\Microsoft\Credentials',
    'AppData\Local\Microsoft\Credentials',
    'AppData\Roaming\Microsoft\Protect',
    'AppData\Roaming\Microsoft\Vault',
    'AppData\Local\Microsoft\Vault',
    'AppData\Roaming\Microsoft\Crypto',
    # Browser profiles
    'AppData\Local\Google\Chrome\User Data',
    'AppData\Local\Microsoft\Edge\User Data',
    'AppData\Local\BraveSoftware\Brave-Browser\User Data',
    'AppData\Roaming\Mozilla\Firefox\Profiles',
    'AppData\Roaming\Opera Software',
]
